<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BX FOLDER — Membres</title>
  <link rel="stylesheet" href="/styles.css?v=1.5.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <main class="admin-shell">
    <div class="admin-top">
      <div class="admin-title"><span class="eyebrow">MEMBERS DATABASE</span><h1>LISTE DES MEMBRES</h1></div>
      <div class="admin-actions">
        <a class="btn nav-btn" href="/admin">Dashboard</a>
        <a class="btn nav-btn" href="/members">Membres publics</a>
        <a class="btn nav-btn" href="/">Voir le site</a>
        <button id="logout" class="btn danger">Déconnexion</button>
      </div>
    </div>

    <section class="admin-card">
      <div class="card-head">
        <div><span class="eyebrow">BX FOLDER</span><h2>Tous les inscrits</h2></div>
        <div id="member-count" class="status-pill">—</div>
      </div>

      <div class="member-tools">
        <div class="field flex-field"><b>⌕</b><input id="member-search" type="search" placeholder="Rechercher par nom, numéro ou pays"></div>
        <select id="member-sex" class="btn">
          <option value="">Tous les sexes</option>
          <option value="male">Garçons</option>
          <option value="female">Filles</option>
        </select>
        <button id="member-search-btn" class="btn gold">Rechercher</button>
      </div>

      <div class="table-wrap members-table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nom VCF</th><th>Téléphone</th><th>Sexe</th><th>Pays</th><th>Date</th></tr></thead>
          <tbody id="rows"><tr><td colspan="6">Chargement…</td></tr></tbody>
        </table>
      </div>

      <div class="pager">
        <button id="prev-page" class="btn">Précédent</button>
        <span id="page-info">Page 1</span>
        <button id="next-page" class="btn">Suivant</button>
      </div>
    </section>
  </main>

  <div id="login-gate" class="gate">
    <form id="login-form" class="login-card">
      <span class="eyebrow">OWNER ACCESS</span>
      <h2>Connexion admin</h2>
      <p class="admin-copy">Connecte-toi pour consulter la liste complète des membres.</p>
      <input id="admin-email" type="email" autocomplete="username" placeholder="Email admin" required>
      <input id="admin-password" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
      <button class="btn gold full-btn" type="submit">Se connecter</button>
      <p id="login-error" class="form-message error"></p>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/members.js?v=1.5.0" defer></script>
</body>
</html>
